[package]
name = "nada-cli"
version = "0.1.3"
edition = "2024"
repository = "https://github.com/navikt/nada-cli"

[dependencies]
chrono = "0"
clap = { version = "4", features = ["derive", "env"] }
google-cloud-container-v1 = "1"
google-cloud-gax = { version = "1", features = [] }
google-cloud-privilegedaccessmanager-v1 = { version = "1", features = [] }
google-cloud-resourcemanager-v3 = "1"
google-cloud-wkt = { version = "1", features = ["time"] }
humantime = "2"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tabwriter = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0"
tracing-subscriber = "0"

[[bin]]
name = "nada"
path = "./src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
